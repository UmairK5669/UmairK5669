<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" fill="none">
  <title>Umair Khan — thoughtful interfaces, serious engineering.</title>
  <desc>A custom engineering drawing connects interface, API and cloud nodes around a UK monogram.</desc>
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" stroke="#F3EEE7" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1040" height="360" rx="12" fill="#191D20"/>
  <rect width="1040" height="360" rx="12" fill="url(#grid)"/>
  <path d="M40 64H1000M40 296H1000" stroke="#3B4144"/>
  <rect x="40" y="29" width="8" height="8" fill="#F18A67"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="1.6" fill="#BEC3C4">
